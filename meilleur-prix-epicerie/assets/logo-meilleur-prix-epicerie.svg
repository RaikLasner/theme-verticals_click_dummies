<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="360" viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand { font-family: Arial, Helvetica, sans-serif; font-size: 84px; font-weight: 700; fill: #111111; letter-spacing: -1.2px; }
    .tld { fill: #8b1e2d; }
    .sub { font-family: Arial, Helvetica, sans-serif; font-size: 41px; fill: #7a7a7a; }
  </style>

  <!-- Correct wine glass silhouette (closer to sketch) -->
  <g fill="#8b1e2d">
    <!-- bowl -->
    <path d="M70 90 
             C70 60, 130 60, 130 90 
             C130 125, 105 140, 100 140 
             C95 140, 70 125, 70 90 Z"/>
    <!-- stem -->
    <rect x="96" y="140" width="8" height="40"/>
    <!-- base -->
    <rect x="75" y="180" width="50" height="10"/>
  </g>

  <!-- Text -->
  <text x="160" y="130" class="brand">
    meilleur-prix-epicerie<tspan class="tld">.fr</tspan>
  </text>

  <text x="160" y="180" class="sub">comparateur prix épicerie</text>
</svg>
